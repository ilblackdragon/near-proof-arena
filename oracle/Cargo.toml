[package]
name = "near-arena-oracle"
version = "0.1.0"
edition = "2024"
publish = false
description = "Judge-owned oracle: runs pinned nearcore Runtime::apply for the near/pv86/receipt-transfer-batch/v0 slice and emits canonical request/witness/claim files."

# Deliberately NOT a member of the repository root workspace: it has path
# dependencies into the pinned nearcore checkout (see NEARCORE_PIN and
# scripts/link-nearcore.sh) and its own Cargo.lock, which resolves every
# third-party crate to exactly the versions in nearcore's own Cargo.lock.
[workspace]
exclude = ["vendor"]

[dependencies]
node-runtime = { path = "vendor/nearcore/runtime/runtime" }
near-store = { path = "vendor/nearcore/core/store" }
near-primitives = { path = "vendor/nearcore/core/primitives", features = ["test_utils"] }
near-primitives-core = { path = "vendor/nearcore/core/primitives-core" }
near-parameters = { path = "vendor/nearcore/core/parameters" }
near-crypto = { path = "vendor/nearcore/core/crypto" }
near-vm-runner = { path = "vendor/nearcore/runtime/near-vm-runner" }
borsh = "1"
hex = "0.4"
sha2 = "0.10"
serde_json = "1"

[patch.crates-io]
protobuf = { git = "https://github.com/near/rust-protobuf.git", branch = "3.0.2-patch" }
protobuf-support = { git = "https://github.com/near/rust-protobuf.git", branch = "3.0.2-patch" }

[profile.dev]
panic = 'abort'
opt-level = 1
