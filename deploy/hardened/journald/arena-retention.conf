# /etc/systemd/journald.conf.d/arena-retention.conf — on every arena host.
# Persistent, sealed journal; keep at least 400 days of service/audit logs
# locally (and ship to the log host for the full audit retention period).
[Journal]
Storage=persistent
Seal=yes
Compress=yes
SystemMaxUse=20G
MaxRetentionSec=400d
MaxFileSec=1month
