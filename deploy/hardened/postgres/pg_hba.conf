# NEAR Proof Arena — pg_hba.conf for the dedicated DB host. First match wins.
# TYPE    DATABASE  USER          ADDRESS          METHOD
local     all       postgres                       peer
# Backups run locally as the arena-backup OS user mapped to arena_backup.
local     arena     arena_backup                   peer map=arena_backup
# Control plane: the running API and the one-shot migration role.
hostssl   arena     arena_api     10.20.0.10/32    scram-sha-256
hostssl   arena     arena_owner   10.20.0.10/32    scram-sha-256
# Workers: only if direct job leasing is kept (CONTRACTS.md §9); worker subnets only.
hostssl   arena     arena_worker  10.20.1.0/24     scram-sha-256
hostssl   arena     arena_worker  10.20.2.0/24     scram-sha-256
hostssl   arena     arena_worker  10.20.3.0/24     scram-sha-256
# Everything else, including non-TLS and replication, is rejected.
host      all       all           0.0.0.0/0        reject
host      all       all           ::/0             reject
