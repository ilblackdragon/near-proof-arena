# NEAR Proof Arena — include from postgresql.conf (include_dir 'conf.d').
listen_addresses = '10.20.0.20'
port = 5432
max_connections = 200

# Transport / auth
ssl = on
ssl_min_protocol_version = 'TLSv1.3'
ssl_cert_file = '/etc/postgresql/tls/server.crt'
ssl_key_file = '/etc/postgresql/tls/server.key'
password_encryption = 'scram-sha-256'

# Audit logging (retention: see docs/DEPLOYMENT.md "Backups and audit retention").
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = '1d'
log_truncate_on_rotation = off
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d %r app=%a '
log_statement = 'ddl'            # all schema changes, by whom
log_min_duration_statement = '5s'
log_lock_waits = on
# Optional: pgaudit for object-level read auditing of secret-bearing tables.
#shared_preload_libraries = 'pgaudit'
#pgaudit.log = 'ddl, role, write'

# Point-in-time recovery (WAL archive to the backup target).
wal_level = replica
archive_mode = on
archive_command = '/usr/local/lib/arena/arena-backup wal %p %f'
archive_timeout = '15min'
