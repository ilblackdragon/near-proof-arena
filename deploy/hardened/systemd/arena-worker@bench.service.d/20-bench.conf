# Dedicated benchmark host: no co-tenancy, pinned CPUs, recorded frequency settings.
# Adjust the CPU lists to the host; CPUs 0-1 are left to the OS and housekeeping
# and 2-N must also be in the kernel's isolcpus=/nohz_full= lists.
[Unit]
# Never share a benchmark host with another worker class.
Conflicts=arena-worker@build.service arena-worker@formal.service arena-worker@oracle.service arena-worker@gpu.service

[Service]
# Supervisor/housekeeping CPUs; the worker pins each sandbox to its
# ARENA_BENCH_CPUS set (passed into SandboxSpec.cpu_set).
AllowedCPUs=0-15
Environment=ARENA_BENCH_CPUS=2-15
# Records governor, frequency limits, turbo/boost, SMT, isolcpus, microcode
# and kernel into a JSON file the worker attaches to every measurement, and
# refuses to start if the host is not in benchmark configuration.
ExecStartPre=/usr/local/lib/arena/bench-host-record --check --cpus 2-15 --out /var/lib/arena-worker/bench/host-settings.json
Environment=ARENA_BENCH_HOST_SETTINGS=/var/lib/arena-worker/bench/host-settings.json
