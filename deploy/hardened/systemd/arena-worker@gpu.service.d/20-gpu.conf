# GPU workers follow docs/ISOLATION.md (runners-vm lane). Firecracker has no
# GPU passthrough, so the GPU route needs its own reviewed isolation design.
# Until that review exists on this host, the unit refuses to start.
[Unit]
AssertPathExists=/etc/arena/gpu-isolation.reviewed
Conflicts=arena-worker@build.service arena-worker@formal.service arena-worker@oracle.service arena-worker@bench.service
