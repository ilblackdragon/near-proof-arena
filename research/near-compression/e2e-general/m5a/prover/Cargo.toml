# E2E M5a prover: the Lean-exported state AIR (interpreted, unchanged) + the SHA-256 block table
# (honest generator of ZkFormal.Sha.Gen) + the native SHA-512 compression chip v4
# (native/sha384-air4, bus ids moved to 100..103) + the public tape, on the unified SWIRL backend
# (BabyBear, Ext12, SHA-384, T*, 42-byte digests, stacked WHIR).  Deps: own copy of the
# pq-state-port tree under /data/illia/nearproof-deps/e2e-m5a/deps (same overlay hash).
[package]
name = "nearproof-e2e-m5a"
version = "0.1.0"
edition = "2024"

[dependencies]
openvm-stark-backend = { path = "/data/illia/nearproof-deps/e2e-m5a/deps/stark-backend-unified/crates/stark-backend", default-features = false, features = ["test-utils", "parallel"] }
openvm-cpu-backend = { path = "/data/illia/nearproof-deps/e2e-m5a/deps/stark-backend-unified/crates/cpu-backend", default-features = false, features = ["parallel"] }
p3-baby-bear = "=0.4.3"
p3-field = "=0.4.3"
p3-air = "=0.4.3"
p3-matrix = "=0.4.3"
p3-maybe-rayon = { version = "=0.4.3", features = ["parallel"] }
sha2 = { version = "=0.10.9", features = ["compress"] }
serde_json = "1"
rayon = "1"

[patch.crates-io]
p3-baby-bear = { path = "/data/illia/nearproof-deps/e2e-m5a/deps/plonky3-ext12/p3-baby-bear" }
p3-monty-31 = { path = "/data/illia/nearproof-deps/e2e-m5a/deps/plonky3-ext12/p3-monty-31" }

[workspace]

[profile.release]
debug = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("chunk-recursion"))'] }
