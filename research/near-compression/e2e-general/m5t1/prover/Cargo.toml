# E2E M5-T1 prover: the Lean-exported runtime AIR (interpreted, unchanged) + the SHA-256 block
# table (honest generator of ZkFormal.Sha.Gen) + the statement / stand-in tapes, on the unified
# SWIRL backend (BabyBear, Ext12, SHA-384, T*, 42-byte digests, stacked WHIR) — lane B's harness
# (`../../m5a/prover`) without the SHA-512 chip. Deps: lane B's copy of the pq-state-port tree
# under /data/illia/nearproof-deps/laneB-t1/deps (read only).
[package]
name = "nearproof-e2e-m5t1"
version = "0.1.0"
edition = "2024"

[dependencies]
openvm-stark-backend = { path = "/data/illia/nearproof-deps/laneB-t1/deps/stark-backend-unified/crates/stark-backend", default-features = false, features = ["test-utils", "parallel"] }
openvm-cpu-backend = { path = "/data/illia/nearproof-deps/laneB-t1/deps/stark-backend-unified/crates/cpu-backend", default-features = false, features = ["parallel"] }
p3-baby-bear = "=0.4.3"
p3-field = "=0.4.3"
p3-air = "=0.4.3"
p3-matrix = "=0.4.3"
p3-maybe-rayon = { version = "=0.4.3", features = ["parallel"] }
sha2 = { version = "=0.10.9", features = ["compress"] }
serde = { version = "1", features = ["derive"] }
p3-symmetric = "=0.4.3"
p3-dft = "=0.4.3"
serde_json = "1"
rayon = "1"

[patch.crates-io]
p3-baby-bear = { path = "/data/illia/nearproof-deps/laneB-t1/deps/plonky3-ext12/p3-baby-bear" }
p3-monty-31 = { path = "/data/illia/nearproof-deps/laneB-t1/deps/plonky3-ext12/p3-monty-31" }

[workspace]

[profile.release]
debug = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("chunk-recursion"))'] }
