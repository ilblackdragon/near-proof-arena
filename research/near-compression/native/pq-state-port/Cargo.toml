# lane/pq-state-port: the complete classical nearAirV3 (D0a, 25 tables) ported unchanged onto the
# unified SWIRL backend (BabyBear, Ext12, SHA-384, T*, 42-byte digests, stacked WHIR).
# Standalone crate; backend = own copy of the pq-wasm-base deps tree (setup.sh), never another
# lane's.
[package]
name = "nearproof-pq-state-port"
version = "0.1.0"
edition = "2024"

[dependencies]
openvm-stark-backend = { path = "/data/illia/nearproof-deps/pq-state-port/stark-backend-unified/crates/stark-backend", default-features = false, features = ["test-utils", "parallel"] }
openvm-cpu-backend = { path = "/data/illia/nearproof-deps/pq-state-port/stark-backend-unified/crates/cpu-backend", default-features = false, features = ["parallel"] }
p3-baby-bear = "=0.4.3"
p3-field = "=0.4.3"
p3-air = "=0.4.3"
p3-matrix = "=0.4.3"
p3-maybe-rayon = { version = "=0.4.3", features = ["parallel"] }
sha2 = { version = "=0.10.9", features = ["compress"] }
serde_json = "1"

[patch.crates-io]
p3-baby-bear = { path = "/data/illia/nearproof-deps/pq-state-port/plonky3-ext12/p3-baby-bear" }
p3-monty-31 = { path = "/data/illia/nearproof-deps/pq-state-port/plonky3-ext12/p3-monty-31" }

[workspace]

[profile.release]
debug = false

# This source is also included by the standalone chunk recursion driver.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("chunk-recursion"))'] }
