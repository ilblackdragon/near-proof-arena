# Direct-Wasm base-layer AIR model and base-faithful proofs (lane/pq-wasm-base).
# Depends only on the NearSpecV3 Wasm semantics (no ZkFormal, no Mathlib).
name = "WasmBase"
version = "0.1.0"
defaultTargets = ["WasmBase", "wasmbase-tool"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "WasmBase"

[[lean_exe]]
name = "wasmbase-tool"
root = "Tool"

# E2E M3: the chunk's own host tape.  The checker's compiled Wasm entry is wrapped at link time so
# each call is observed (and returned unchanged); see `Tape.lean`.  Build with `build-tape.sh`
# (it compiles the C wrapper `tape_shim.c` first).
[[lean_exe]]
name = "wasmbase-tape"
root = "Tape"
moreLinkArgs = [".lake/build/tape_shim.o", "-Wl,--wrap=lp_NearSpecV3_NearSpecV3_Wasm_runCallWithLimitsFast"]

[[require]]
name = "NearSpecV3"
path = "../../../spec/lean/v3"

# E2E M4b: lane B's SHA-512 chip interface contract (`StateM5a.Sha512If`) and SHA-384 Merkle
# binding lemmas (`StateM5a.StateView`) are reused, not duplicated.
[[require]]
name = "StateM5a"
path = "../e2e-general/m5a/lean"

# Only `ZkFormal.Algebra.Fp` (BabyBear, primality certificate, field instance) is imported.
[[require]]
name = "ZkFormal"
path = "../../../zk-formal"
