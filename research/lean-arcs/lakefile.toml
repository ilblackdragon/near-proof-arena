name = "arcproto"
version = "0.1.0"
defaultTargets = ["arcproto"]

[[require]]
name = "NearSpecV3"
path = "../../spec/lean/v3"

[[lean_exe]]
name = "arcproto"
root = "ArcProto"
supportInterpreter = true

[[lean_exe]]
name = "arcprobe"
root = "ArcProbe"

[[lean_exe]]
name = "arcprobe-old"
root = "ArcProbeOld"

[[lean_exe]]
name = "arcprobe-broken"
root = "ArcProbeBroken"
