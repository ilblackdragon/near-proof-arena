[package]
name = "arena-npai-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arena-npai = { path = ".." }

# Separate workspace: not part of the root build.
[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exec"
path = "fuzz_targets/exec.rs"
test = false
doc = false
bench = false
