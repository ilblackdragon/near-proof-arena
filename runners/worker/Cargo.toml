[package]
name = "arena-worker"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Arena judge worker: lease job -> fetch inputs by digest -> run in sandbox -> upload -> complete"

[dependencies]
arena-types = { path = "../../common/arena-types" }
arena-archive = { path = "../archive" }
arena-sandbox = { path = "../sandbox" }
arena-measure = { path = "../measure" }
arena-firecracker = { path = "../firecracker" }
proof-mutators = { path = "../../adversarial/proof-mutators" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
arena-jobs = { path = "../../server/arena-jobs", features = ["client"] }
arena-formal-checker = { path = "../formal-checker" }
tokio = { workspace = true }
libc.workspace = true

[dev-dependencies]
arena-npai = { path = "../npai" }
tempfile.workspace = true
zstd.workspace = true
tar.workspace = true

[[bin]]
name = "arena-worker"
path = "src/main.rs"

[features]
# `examples/bench_session.rs` (from main) is written against the pre-arena-jobs
# worker API (explicit batches/seeds in BenchmarkJob) and does not build
# against the integrated worker yet; it is excluded from default builds.
legacy-bench-session = []

[[example]]
name = "bench_session"
required-features = ["legacy-bench-session"]
