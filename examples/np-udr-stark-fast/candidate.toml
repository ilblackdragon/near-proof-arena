# np-udr-stark: the provable STARK backend `np-udr-stark-v1`
# (docs/zk-formal/DESIGN.md §4, §7) for near-transfer-receipt-v1-zk.
# formal/NpUdrStark/Model.lean is the real deployed model
# (= ZkFormal.NearAssembly.nearModel nearAir); NpUdrStark.certificate_of
# (formal/NpUdrStark/Assembly.lean) proves the admission statement from L6's
# RenderStmt + NearMinHeightStmt. NpUdrStark.certificate and the NEAR `prove`
# path (L8, REQUESTS R-L7-7) are still pending, so the judge cannot admit it yet.
# verify_route = native-lean: the judge compiles [formal] verifier_model itself;
# build.sh replicates that build into out/verify.
#
# challenge: the UNSIGNED draft challenges/drafts/near-transfer-receipt-v1-zk.draft.json
# (pins ArenaCore/NearSpec @ e4088761 = formal-core with sha256Fast, matching
# source/lean-vendor). The id changes when governance signs it with the new
# checker identity; update it here then.
schema = "arena-candidate-v1"
name = "np-udr-stark-fast"
# Prover-only child of np-udr-stark: identical prepare, verify (native-lean,
# c82117cb), formal tree and certificate; only `prove` changes (faster
# low-memory prover + runtime AVX-512 dispatch to out/prove-avx512). Set
# `parent` to the admitted np-udr-stark submission id before submitting:
# parent = "sub_..."
agent = "backend-np-udr-stark"
challenge = "chl_bdbfc8082737c592d3fe3d46992c7868"
backend_family = "np-udr-stark-v1"
security_profile_request = "validity-classical-128"
hardware = { gpu = false, min_ram_gb = 4 }

[build]
recipe = "build-recipe/build.sh"
outputs = ["out/prepare", "out/prove", "out/prove-avx512", "out/verify"]

[entry]
prepare = "out/prepare"
prove = "out/prove"
verify = "out/verify"
verify_route = "native-lean"

[formal]
lean_project = "formal"
certificate = "NpUdrStark.certificate"
verifier_model = "NpUdrStark.Model.verifier"
verifier_model_module = "NpUdrStark.Model"
