[package]
name = "zk-prover"
version = "0.1.0"
edition = "2021"
publish = false
description = "prepare + prove entry points (SP1 v6.8.1 CPU prover, compressed STARK proofs)"

[dependencies]
sp1-sdk = { version = "=6.8.1", default-features = false, features = ["blocking"] }
bincode = "1.3"
transfer-core = { path = "../core" }
zk-artifacts = { path = "../artifacts" }

[[bin]]
name = "prepare"
path = "src/bin/prepare.rs"

[[bin]]
name = "prove"
path = "src/bin/prove.rs"

[[bin]]
name = "zkexec"
path = "src/bin/zkexec.rs"
