[package]
name = "transfer-guest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sp1-zkvm = "=6.8.1"
transfer-core = { path = "../core" }

# Standalone workspace: built for riscv64im-succinct-zkvm-elf with the
# `succinct` toolchain (see build-recipe/build.sh).
[workspace]

[patch.crates-io]
# SHA-256 -> SP1 SHA-256 extend/compress precompiles.
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.2.0" }

[profile.release]
codegen-units = 1
incremental = false
lto = false
opt-level = 3
