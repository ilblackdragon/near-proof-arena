[package]
name = "zk-verifier"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone verify entry point: SP1 v6.8.1 compressed-proof verifier (no prover code linked)"

[dependencies]
sp1-verifier = { version = "=6.8.1", default-features = false, features = ["full", "std"] }
sp1-hypercube = "=6.8.1"
sp1-primitives = "=6.8.1"
sp1-recursion-executor = "=6.8.1"
slop-algebra = "=6.8.1"
bincode = "1.3"
transfer-core = { path = "../core" }
zk-artifacts = { path = "../artifacts" }

[[bin]]
name = "verify"
path = "src/main.rs"
