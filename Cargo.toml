[workspace]
resolver = "2"
members = [
    "common/arena-types",
    "server/arena-jobs",
    "server/arena-store",
    "server/arena-db",
    "server/arena-orchestrator",
    "server/arena-server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
schemars = "0.8"
toml = "0.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# server lane
arena-types = { path = "common/arena-types" }
arena-jobs = { path = "server/arena-jobs" }
arena-store = { path = "server/arena-store" }
arena-db = { path = "server/arena-db" }
arena-orchestrator = { path = "server/arena-orchestrator" }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json", "time", "uuid", "migrate", "macros"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "set-header"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"
async-trait = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
