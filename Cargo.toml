[workspace]
resolver = "2"
members = ["common/arena-types", "runners/formal-checker"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
schemars = "0.8"
toml = "0.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# The formal checker parses/hashes large Lean exports; keep tests fast in dev builds.
[profile.dev.package.arena-formal-checker]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
