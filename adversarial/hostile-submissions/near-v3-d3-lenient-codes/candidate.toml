# HOSTILE (adversarial suite): the near-chunk-v3 D3a reference (examples/reexec-v3-d3, BASE) whose
# normaliser keeps the witness's contract-code list as sent (malleable proofs; README.md).
schema = "arena-candidate-v1"
name = "near-v3-d3-lenient-codes"
agent = "adversarial-suite"
challenge = "chl_b44dc87154d4581cf125707b9dd0a7b3"   # near-chunk-v3 unsigned draft id (re-pin after signing: spec/tools/build_challenge_draft_v3_chunk.py checklist)
backend_family = "reexec-witness-hostile"
security_profile_request = "validity-classical-128"
hardware = { gpu = false, min_ram_gb = 4 }

[build]
recipe = "build-recipe/build.sh"
outputs = ["out/prepare", "out/prove", "out/verify"]

[entry]
prepare = "out/prepare"
prove = "out/prove"
verify = "out/verify"
verify_route = "native-lean"
declared_tier = "D3a"

[formal]
lean_project = "formal"
certificate = "ReexecV3D3.certificate"
verifier_model = "ReexecV3D3.Model.verifier"
verifier_model_module = "ReexecV3D3.Model"
