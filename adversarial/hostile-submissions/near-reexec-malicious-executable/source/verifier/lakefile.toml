# DEVELOPMENT project: builds the certificate (../../formal) against the
# vendored trusted packages and the judge-local Expected emulation. The
# deployed verifier is built by build-recipe/build.sh (judge layout).
name = "reexec-verifier"
version = "0.1.0"
defaultTargets = ["ReexecWitness"]

[[lean_lib]]
name = "ReexecWitness"
srcDir = "../../formal"

[[require]]
name = "NearSpec"
path = "../lean-vendor/spec/lean"

[[require]]
name = "ArenaCore"
path = "../lean-vendor/formal-core"

# LOCAL EMULATION of the judge-generated Expected modules (judge-local/render.py).
[[lean_lib]]
name = "ArenaExpected"
srcDir = "../../judge-local/out"
roots = ["ArenaExpected", "ArenaExpectedInst"]
